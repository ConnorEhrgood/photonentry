# Throwaway Postgres + the test image. Nothing here touches a real database.
#   scripts/remote-test.sh runs it on LXC 800 (the runner has no Docker).
# The database image is the one PhotonGuard and PhotonVox use on LXC 800 (TimescaleDB on Postgres 16): no extra download on a host short of
# disk, and the extension is there for when door events become a hypertable.
name: photonentry-test

services:
  db-test:
    image: timescale/timescaledb:2.30.1-pg16
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: pg_test
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d pg_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      db-test:
        condition: service_healthy
    mem_limit: 1g
    environment:
      PHOTONENTRY_DB_TESTS: "1"
      DATABASE_URL: postgresql+psycopg://entry_app:apptestpassword0123456789@db-test:5432/pg_test
      SYSTEM_DATABASE_URL: postgresql+psycopg://entry_system:systemtestpassword0123456789@db-test:5432/pg_test
      MIGRATE_DATABASE_URL: postgresql+psycopg://pg:test-password@db-test:5432/pg_test
      APP_DB_PASSWORD: apptestpassword0123456789
      SYSTEM_DB_PASSWORD: systemtestpassword0123456789
    command: ["python", "-m", "pytest", "-p", "no:warnings"]
