# PhotonEntry on its host (BUILD-GUIDE Step 8: the PhotonGuard VPS, behind that host's Caddy): the database, a one-shot migration, the API (which
# also serves the controllers' link and the intercoms' provisioning), the worker and the web app. OPERATIONS.md walks through it.
#   docker network create entry-edge                  # once; the host's Caddy joins it and loads deploy/caddy/entry.caddy
#   scripts/deploy.sh prod                            # builds the pushed commit on the host, migrates, starts, waits for health, tags
# Every service has a memory ceiling, a health check (long-running ones) and the shared logging limits. Nothing publishes a port: the host's Caddy
# reaches the API and the web app by container name on entry-edge. Third-party images are pinned by digest.
name: photonentry

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

# The owner: migrations only. The API and worker never get its password (blanked below).
x-owner-db-url: &owner-db-url postgresql+psycopg://${POSTGRES_USER:-photonentry}:${POSTGRES_PASSWORD}@photonentry-db-1:5432/${POSTGRES_DB:-photonentry}
# The API logs in as entry_app and the worker (and the link service, sync, first sign-ins) as entry_system: neither owns the tables (row-level security).
x-app-db-url: &app-db-url postgresql+psycopg://entry_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@photonentry-db-1:5432/${POSTGRES_DB:-photonentry}
x-system-db-url: &system-db-url postgresql+psycopg://entry_system:${SYSTEM_DB_PASSWORD:?set SYSTEM_DB_PASSWORD in .env}@photonentry-db-1:5432/${POSTGRES_DB:-photonentry}

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-photonentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-photonentry}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photonentry} -d ${POSTGRES_DB:-photonentry}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    image: photonentry-api:${BUILD_SHA:?deploy.sh sets BUILD_SHA}
    build: { context: ., dockerfile: api/Dockerfile, args: { BUILD_SHA: "${BUILD_SHA}" } }
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      MIGRATE_DATABASE_URL: *owner-db-url
      DATABASE_URL: *owner-db-url
    depends_on:
      db:
        condition: service_healthy
    <<: *hardened
    logging: *logging

  # The demo organization's seed (docs/DEMO.md), one-shot and only on request (`scripts/demo.sh`): `seed` reads the simulators' claim codes on
  # stdin and writes their roster to stdout. As the owner, like migrate, so the API's and worker's roles get no new rights.
  demo:
    image: photonentry-api:${BUILD_SHA:?deploy.sh sets BUILD_SHA}
    profiles: [demo]
    restart: "no"
    entrypoint: ["python", "-m", "app.demo"]
    env_file: .env
    environment:
      MIGRATE_DATABASE_URL: *owner-db-url
      DATABASE_URL: *app-db-url
      SYSTEM_DATABASE_URL: *system-db-url
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
    <<: *hardened
    logging: *logging

  api:
    image: photonentry-api:${BUILD_SHA:?deploy.sh sets BUILD_SHA}
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    env_file: .env
    environment:
      DATABASE_URL: *app-db-url
      SYSTEM_DATABASE_URL: *system-db-url
      POSTGRES_PASSWORD: ""      # the owner's password is not the API's to hold
      MIGRATE_DATABASE_URL: ""
      ENVIRONMENT: ${ENVIRONMENT:-production}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [default, entry-edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *hardened
    logging: *logging

  worker:
    image: photonentry-api:${BUILD_SHA:?deploy.sh sets BUILD_SHA}
    restart: unless-stopped
    mem_limit: 256m
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: *app-db-url
      SYSTEM_DATABASE_URL: *system-db-url
      POSTGRES_PASSWORD: ""
      MIGRATE_DATABASE_URL: ""
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The worker touches /tmp/worker.ok every pass (and the worker_heartbeat row /readyz reads).
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker.ok') < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    <<: *hardened
    logging: *logging

  web:
    image: photonentry-web:${BUILD_SHA:?deploy.sh sets BUILD_SHA}
    build: { context: ., dockerfile: deploy/web/Dockerfile, args: { BUILD_SHA: "${BUILD_SHA}" } }
    restart: unless-stopped
    mem_limit: 64m
    environment:
      API_ORIGIN: ${API_ORIGIN:-https://api.entry.photonind.com}
      OIDC_ORIGIN: ${OIDC_ORIGIN:-https://id.photonind.com}
      DIRECTORY_API_ORIGIN: ${DIRECTORY_API_ORIGIN:-https://api.account.photonind.com}
      VITE_API_URL: ${VITE_API_URL:-https://api.entry.photonind.com}
      VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-https://id.photonind.com}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?set VITE_OIDC_CLIENT_ID in .env (the PhotonEntry web application's client id in PhotonID)}
      VITE_OIDC_AUDIENCE_PROJECT: ${VITE_OIDC_AUDIENCE_PROJECT:?set VITE_OIDC_AUDIENCE_PROJECT in .env (the PhotonEntry project id in PhotonID)}
      VITE_DIRECTORY_APP_URL: ${VITE_DIRECTORY_APP_URL:-https://account.photonind.com}
      VITE_DIRECTORY_API_URL: ${VITE_DIRECTORY_API_URL:-https://api.account.photonind.com}
      VITE_DIRECTORY_AUDIENCE_PROJECT: ${VITE_DIRECTORY_AUDIENCE_PROJECT:-398636902653100035}
    networks: [default, entry-edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  db_data:

networks:
  entry-edge:
    external: true
    name: entry-edge
